name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            version: 1.16.1
          - name: web
            dockerfile: Dockerfile.web
            version: 1.16.1
          - name: sandbox
            dockerfile: Dockerfile.sandbox
            version: 0.2.15
          - name: plugin
            dockerfile: Dockerfile.plugin
            version: 0.6.3
          - name: postgres
            dockerfile: Dockerfile.postgres
            version: pg17
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/dify-railway-${{ matrix.name }}:${{ matrix.version }}
            ghcr.io/bon5co/dify-railway-${{ matrix.name }}:latest
